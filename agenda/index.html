<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agendar una llamada | Brenda Flores</title>

    <!-- ════════════════════════════════════════════════════════════
         AQUI SE CAMBIA EL DESTINO
         Esta pagina existe para que brendaflores.co/agenda sea la
         unica liga que repartas. Si algun dia dejas Calendly, cambia
         la URL en las TRES lineas marcadas abajo y todo lo que ya
         entregaste (firma, WhatsApp, LinkedIn, sitio) sigue sirviendo.
         ════════════════════════════════════════════════════════════ -->

    <!-- destino 1 de 3 -->
    <meta
      http-equiv="refresh"
      content="0; url=https://calendly.com/brenda-brendaflores/20min"
    />
    <meta name="robots" content="noindex, follow" />

    <style>
      :root {
        --ink: #0f0f1a;
        --muted: #6b7280;
        --accent: #4f46e5;
        --paper: #ffffff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--paper);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        padding: 24px;
        line-height: 1.6;
      }
      .box {
        max-width: 34rem;
      }
      h1 {
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: -0.01em;
        margin: 0 0 10px;
      }
      p {
        color: var(--muted);
        margin: 0 0 24px;
        font-size: 0.97rem;
      }
      a.btn {
        display: inline-block;
        background: var(--ink);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.95rem;
        padding: 14px 28px;
        border-radius: 999px;
        transition: background 0.2s;
      }
      a.btn:hover,
      a.btn:focus-visible {
        background: var(--accent);
      }
      .back {
        display: block;
        margin-top: 22px;
        color: var(--muted);
        font-size: 0.87rem;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
        border-radius: 3px;
      }
    </style>
  </head>

  <body>
    <div class="box">
      <h1>Te estoy llevando al calendario</h1>
      <p>
        Si no pasa nada en un segundo, usa el botón. Son veinte minutos y te
        llamo yo al número que dejes.
      </p>
      <!-- destino 2 de 3 -->
      <a class="btn" href="https://calendly.com/brenda-brendaflores/20min"
        >Abrir el calendario</a
      >
      <a class="back" href="/">Volver a brendaflores.co</a>
    </div>

    <script>
      // destino 3 de 3
      window.location.replace("https://calendly.com/brenda-brendaflores/20min");
    </script>
  </body>
</html>
